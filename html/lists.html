<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <h4>Ordered Lists</h4>
    <ol type="A">
        <li>Idly</li>
        <li>Dosa</li>
        <li>Poha</li>
    </ol><br>
    <hr>
    <h4>Ordered Lists</h4>
    <ul type="circle">
        <li>biryani</li>
        <li>tahari</li>
        <li>mandi</li>
    </ul>
    <h4></h4>Ordered Lists</h4>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper text mark up language</dd>
        <dt>CSS</dt>
        <dd>Cascading style sheets</dd>
    </dl>
    <hr>
    <h3>Nested Lists</h3>
    <ul>
        <li>Fruits</li>
    </ul>
</body>
</html>
