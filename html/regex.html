<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex</title>
</head>
<body>
    <h4>Regex Validation</h4>
    <hr>
    <br>
    <form>
    <label for="name">Name</label>
    <input type="text" id="name" pattern="^[A-Z]{1}[a-z]{1}{2,25}$" name="username">
    <br>
    <br>
    <label for="number">Phone</label>
    <input type="tel" id="number" pattern="^\d{3}-\d{3}-\d{4}$" name="usernumber">
    <br>
    <br>
    <!-- Indian format -->
     <label for="num">Indian Number</label>
    <input type="tel" id="num" pattern="^+91 \d---$" name="username">
    <br>
    <br>
     <label for="pass">Password</label>
    <input type="text" id="pass" pattern="^.[A-Za-z\d@$!%&*?&#]{8,}$" name="userpassword">
    <br>
    <br>
    <!-- LookAhead -->
     <label for="pass">Password with LA</label>
    <input type="text" id="pass" pattern="^(?=.*[a-z]){8,}$" name="userpassword">


    <button type="submit">Submit</button>

    <!-- email validation -->
     <label for="email">Enter your email:</label>
     <input id="email" type="email" name="email" pattern="^[A-Za-z0-9.-%+\_] + @[A-Za-z0-9#$%&*] + /.[A-Za-z]{2,}$">
    </form>
    
</body>
</html>
