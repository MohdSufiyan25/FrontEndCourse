<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid spant</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 5px;
            background-color: aqua;

        }
        .container div {
            background-color: gray;
        }
        .item1 {
            /* grid-column-start: 1;
            grid-column-end: 3; */
            grid-column: 1/3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>

    </div>
    
</body>
</html>
