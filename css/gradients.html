<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <style>
        div#lg {
            width: 100%;
            height: 100px;
            background: linear-gradient(to right, red, yellow, green);
        }
        div#rg {
            width: 100%;
            height: 100px;
            background: radial-gradient(circle,red,yellow,blue);
        }
        div#cg {
            width: 200px;
            height: 200px;
            background: conic-gradient(red 0deg 90deg,blue 90deg 180deg,green 180deg 360deg);
            border-radius: 50%;
        }
    </style>

    
</head>
<body>
    <h2>Linear Gradient</h2>
    <div id="lg"></div>
    <h2>Radial Gradient</h2>
    <div id="rg"></div>
    <h2>Conic Gradient</h2>
    <div id="cg"></div>
    
</body>
</html>
