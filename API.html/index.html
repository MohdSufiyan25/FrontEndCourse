<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Movies</title>
  <!-- Added FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Global Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Default Login Background */
      background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }

    /* Change background when movie page is active */
    body.movie-mode {
      background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1920&q=80');
    }

    /* --- Login Page UI --- */
    #loginPage {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.95); /* Slightly transparent white */
      color: black;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 300px;
      text-align: center;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-weight: normal;
      color: #333;
    }

    /* Input fields with icons */
    .input-group {
      position: relative;
      margin-bottom: 15px;
    }

    .input-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px 12px 40px; /* Padding on left to make room for icon */
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      background: #f8f9fa;
      font-size: 14px;
    }

    .card button {
      width: 100%;
      padding: 12px;
      background: #e05638; /* Orange-Red button */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    .card button:hover {
      background: #c7472c;
    }

    /* --- Movie Page UI --- */
    #moviePage {
      display: none; /* Hidden initially */
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
    }

    #moviePage h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: normal;
      font-size: 28px;
    }

    /* Search Bar */
    .search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .search-container input {
      width: 60%;
      max-width: 400px;
      padding: 12px 15px;
      border: none;
      border-radius: 6px 0 0 6px;
      outline: none;
      font-size: 16px;
      color: #333;
    }

    .search-container button {
      padding: 12px 25px;
      background: #e05638; /* Orange-Red button */
      color: white;
      border: none;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      font-size: 16px;
    }

    .search-container button:hover {
      background: #c7472c;
    }

    /* Movie Grid Layout */
    #movieList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 0;
      list-style: none;
    }

    .movie-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .movie-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .movie-info {
      padding: 15px 10px;
      background: white;
      flex-grow: 1; /* Pushes content appropriately */
    }

    .movie-info h3 {
      color: #a3221a; /* Dark Red text matching image */
      font-size: 15px;
      margin: 0 0 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-info p {
      color: #777;
      font-size: 13px;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div id="loginPage">
    <div class="card">
      <h2>Login</h2>
      
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Enter Email" required>
      </div>
      
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter Password" required>
      </div>

      <button onclick="login()">Login</button>
      <p id="errorMsg" style="color:red; font-size: 14px; margin-top: 15px;"></p>
    </div>
  </div>

  <!-- Movie Page -->
  <div id="moviePage">
    <h1><i class="fas fa-film"></i> Movie Search</h1>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Enter movie name">
      <button onclick="searchMovies()">Search</button>
    </div>
    
    <ul id="movieList"></ul>
  </div>

  <script>
    const apiKey = "33583da4"; // 🔑 Replace with your OMDb API key

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      try {
        const res = await fetch("users.json");
        const users = await res.json();

        const user = users.find(u => u.email === email && u.password === password);

        if (user) {
          // Switch to movie mode
          document.body.classList.add("movie-mode");
          document.getElementById("loginPage").style.display = "none";
          document.getElementById("moviePage").style.display = "block";
          document.getElementById("moviePage").style.margin = "0 auto";
        } else {
          errorMsg.textContent = "Invalid email or password";
        }
      } catch (err) {
        console.error("Error loading users.json:", err);
      }
    }

    async function searchMovies() {
      const searchTerm = document.getElementById("searchInput").value.trim();
      const apiUrl = `https://www.omdbapi.com/?apikey=${apiKey}&s=${searchTerm}`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        const movieList = document.getElementById("movieList");
        movieList.innerHTML = "";

        if (data.Response === "True") {
          data.Search.forEach(movie => {
            const li = document.createElement("li");
            li.classList.add("movie-card");

            // Updated HTML structure for the card
            li.innerHTML = `
              <img src="${movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${movie.Title}">
              <div class="movie-info">
                <h3>${movie.Title}</h3>
                <p>${movie.Year}</p>
              </div>
            `;
            movieList.appendChild(li);
          });
        } else {
          movieList.innerHTML = `<li style="grid-column: 1 / -1; text-align: center; color: white;">No movies found for "${searchTerm}"</li>`;
        }
      } catch (error) {
        console.error("Error fetching movies:", error);
      }
    }
  </script>

</body>
</html>
