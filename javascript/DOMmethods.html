<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Style</title>

    <style>
        .highlight {
            background-color: brown;
            color: orange;
            font-weight: bold;
        }

        .theme {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <h1 id="text">Our class styles in DOM</h1>
    <button onclick="addstyle()">add</button>
    <button onclick="removestyle()">remove</button>    <button onclick="togglestyle()">toggle</button>    <button onclick="containstyle()">contain</button>
    
<script>
    let card=document.getElementById("text");
    let b = document.querySelector("body");
    function addstyle() {
        card.classList.add("highlight");
    }

    function removestyle() {
        card.classList.remove("highlight");
    }

    function togglestyle() {
        b.classList.toggle("theme");
    }

    function containstyle() {
        if(card.classList.contain("highlight")) {
            alert("Highlight as been applied")
        }
        else {
            alert("Highlight as not been applied")
        }
    }
</script>

</body>
</html>
