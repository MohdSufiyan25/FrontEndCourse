<!-- // user name - a-zA-Z, min 2 max 15, empty -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Validation</title>
</head>
<body>
    <form>
        <!-- Not empty,Between 3 -15 characters, only letters, numbers -->
         <label>Username</label>
         <input type="text" id="username">
         <br><br>

         <label for="email">Email</label>
         <input type="email" id="email" name="email">
         <br><br>

         <!--  -->

         <label for="password">Password</label>
         <input type="password" id="password" name="password">
         <br>
         <br>
         <button type="submit">submit</button>
    </form>
    
 <script>
    f = document.querySelector("form");
      f.addEventListener('submit', (event) => {
        event.preventDefault();
        let username = document.getElementById("username").value.trim();

        // regex only letters, numbers, underscores

        let regex = /^[a-zA-Z]+$/;

        if  (username === "") {
            alert("Username is required!");
        } else if (username.length < 3) {
            alert("Username must at least 3 characters!");
        }  else if (username.length > 15) {
            alert("Username must not conced  15 characters!");
        } else if (!regex.test(username)) {
            alert("Only letters allowed");
        } else {
            alert("Valid Name");
        }
      

      const email = document.getElementById("email").value.trim();
      const emailPattern = /^[a-zA-Z0-9._-]+@[a-zA-a-zA-Z0-9.-]+\.[a-a-zA-Z]{2,}$/;

      if (!emailPattern.test(email)) {
        alert("Please enter a valid email address");
      } else {
        alert("Valid Email.");
      }

      const password =  document.getElementById("password").value;
      const passwordpattern = /^(?=.*[A-za-z])(?=.*\d)[A-za-z\d]{8,}$/;

      if (passwordpattern.test(password)) {
        alert("Password must be at least 8 characters long");
      } alert("Password is Valid!");
      alert("Form Submitted");
    });
 </script>

</body>
</html>
