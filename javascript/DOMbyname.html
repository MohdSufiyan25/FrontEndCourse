<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getElementByName</title>
</head>
<body>
    <input type="text" name="user">
    <button onclick="showdata()">Click Me</button>
    <p id="output">Display value here</p>
    
    <script>
        function showdata() {
            let x = document.getElementsByName("user")[0].value;
            document.getElementById("output").innerText = x;
        }
    </script>
</body>
</html>
